name: Python CI/CD Quality Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r requirements.txt

    - name: Lint & Syntax verification
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 bot.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 bot.py --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Dry-run test Python compilation
      run: |
        python -m py_compile bot.py
