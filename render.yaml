services:
  - type: web
    name: studylkbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false          # Set manually in Render dashboard
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_URL
        sync: false          # e.g. https://studylkbot.onrender.com
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBHOOK_SECRET
        generateValue: true  # Render auto-generates a secret
      - key: PYTHON_VERSION
        value: "3.11.0"
